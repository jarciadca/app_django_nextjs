# ============================================================
# Workflow de Integración Continua (CI).
# Se ejecuta en cada push a main y en cada PR hacia main.
# Valida estructura del repo, formato de Markdown y sintaxis YAML.
# NO ejecuta tests ni instala Python/Node porque aún no hay código.
# ============================================================

# Nombre visible en la pestaña "Actions" de GitHub.
name: CI

# Disparadores del workflow.
on:
  # Se ejecuta en cada push...
  push:
    # ...pero solo en la rama main (no en ramas de feature sueltas).
    branches: [main]
  # Se ejecuta en cada pull request...
  pull_request:
    # ...que apunte a main.
    branches: [main]

# Permisos mínimos que el workflow necesita del token de GitHub.
# "contents: read" basta para hacer checkout del repo.
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # JOB 1: Validar la estructura del repositorio.
  # Comprueba que los archivos obligatorios existen.
  # ----------------------------------------------------------
  repo-structure:
    # Nombre legible del job que verás en GitHub.
    name: Validar estructura del repo
    # Sistema operativo del runner.
    runs-on: ubuntu-latest

    steps:
      # Descarga el contenido del repositorio en el runner.
      - name: Checkout del código
        uses: actions/checkout@v4

      # Verifica que los archivos clave existen.
      # Si falta alguno, el step falla y con él todo el job.
      - name: Verificar archivos obligatorios
        run: |
          # Lista de archivos que DEBEN existir en la raíz o en rutas conocidas.
          archivos=(
            "README.md"
            ".gitignore"
            ".env.example"
            "docs/architecture.md"
          )
          # Iteramos sobre cada archivo.
          for archivo in "${archivos[@]}"; do
            # -f comprueba que existe y es un archivo regular.
            if [ ! -f "$archivo" ]; then
              # Mensaje de error claro en el log del workflow.
              echo "::error::Falta el archivo obligatorio: $archivo"
              # Salida con código de error para que el step falle.
              exit 1
            fi
            # Si existe, lo registramos como info.
            echo "OK: $archivo existe"
          done
          # Si llegamos aquí, todos existen.
          echo "Todos los archivos obligatorios están presentes."

      # Verifica que .env NO está versionado (debe estar en .gitignore).
      - name: Verificar que .env no está versionado
        run: |
          # git ls-files lista los archivos versionados.
          # grep busca ".env" exacto como línea.
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::El archivo .env está versionado. Debe estar en .gitignore."
            exit 1
          fi
          echo "OK: .env no está versionado."

  # ----------------------------------------------------------
  # JOB 2: Lint de Markdown.
  # Usa markdownlint-cli vía npx (Node ya está disponible en el runner).
  # ----------------------------------------------------------
  markdown-lint:
    name: Lint de Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Instala Node 20 en el runner (ya viene, pero fijamos versión explícita).
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ejecuta markdownlint sobre todos los .md del repo.
      - name: Ejecutar markdownlint
        run: |
          # --config apunta al archivo de reglas.
          # El último argumento es el patrón de archivos a lintear.
          npx --yes markdownlint-cli@0.42.0 \
            --config .markdownlint.json \
            "**/*.md" \
            --ignore node_modules \
            --ignore .git

  # ----------------------------------------------------------
  # JOB 3: Validar sintaxis de todos los YAML del repo.
  # Detecta errores tipográficos en workflows y otros YAML.
  # ----------------------------------------------------------
  yaml-lint:
    name: Lint de YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Instala yamllint vía pip (Python ya viene en el runner ubuntu-latest).
      - name: Instalar yamllint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint==1.35.1

      # Ejecuta yamllint con configuración relajada para GitHub Actions.
      # Los workflows de GitHub a veces tienen líneas largas y valores sin comillas,
      # así que relajamos esas reglas específicamente.
      - name: Ejecutar yamllint
        run: |
          yamllint --strict \
            -d "{extends: default, rules: {line-length: {max: 120}, truthy: {allowed-values: ['true', 'false', 'on']}}}" \
            .github/

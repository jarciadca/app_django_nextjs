# ============================================================
# CI: valida estructura, lint de Markdown/YAML y backend Python.
# Se ejecuta en push a main y a ramas feat/*, y en PRs hacia main.
# ============================================================

name: CI

on:
  # Push a main (por si alguien mergea) y a ramas de feature.
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  # PRs que apunten a main.
  pull_request:
    branches: [main]

# Permisos mínimos.
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # JOB 1: Validar estructura del repositorio.
  # ----------------------------------------------------------
  repo-structure:
    name: Validar estructura del repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar archivos obligatorios
        run: |
          archivos=(
            "README.md"
            ".gitignore"
            ".env.example"
            "docs/architecture.md"
            "backend/manage.py"
            "backend/requirements/base.txt"
            "backend/pyproject.toml"
          )
          for archivo in "${archivos[@]}"; do
            if [ ! -f "$archivo" ]; then
              echo "::error::Falta el archivo obligatorio: $archivo"
              exit 1
            fi
            echo "OK: $archivo existe"
          done

      - name: Verificar que .env no está versionado
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::El archivo .env está versionado. Debe estar en .gitignore."
            exit 1
          fi
          echo "OK: .env no está versionado."

  # ----------------------------------------------------------
  # JOB 2: Lint de Markdown.
  # ----------------------------------------------------------
  markdown-lint:
    name: Lint de Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar markdownlint
        run: |
          npx --yes markdownlint-cli@0.42.0 \
            --config .markdownlint.json \
            "**/*.md" \
            --ignore node_modules \
            --ignore .git

  # ----------------------------------------------------------
  # JOB 3: Lint de YAML.
  # ----------------------------------------------------------
  yaml-lint:
    name: Lint de YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1

      - name: Ejecutar yamllint
        run: |
          yamllint --strict \
            -d "{extends: default, rules: {line-length: {max: 120}, truthy: {allowed-values: ['true', 'false', 'on']}}}" \
            .github/

  # ----------------------------------------------------------
  # JOB 4: Backend Python (ruff + black + mypy + pytest).
  # ----------------------------------------------------------
  backend:
    name: Backend Python
    runs-on: ubuntu-latest

    # Servicio PostgreSQL temporal para los tests.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Espera a que PostgreSQL esté listo antes de continuar.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables de entorno para Django en CI.
    env:
      DJANGO_SECRET_KEY: ci-secret-key-no-usar-en-produccion
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
      DJANGO_ENV: test
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements/test.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Black check
        working-directory: backend
        run: black --check .

      - name: Mypy
        working-directory: backend
        run: mypy .

      - name: Django check
        working-directory: backend
        run: python manage.py check --settings=config.settings.test

      - name: Pytest
        working-directory: backend
        run: pytest
